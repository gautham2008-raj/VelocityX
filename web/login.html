<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VELOCITY X</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

  <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand" style="justify-content:center; margin-bottom: 0.5rem;">VELOCITY<span>X</span></a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Customer Access Portal</p>
    </div>

    <form id="customerLoginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" required placeholder="alex@velocityx.io">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
      </div>
      <div id="loginError" style="color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Authenticate</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--accent-cyan);">Register here</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      try {
        await AuthEngine.login(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPassword').value,
          false
        );
        window.location.href = 'index.html';
      } catch (ex) {
        err.innerText = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
