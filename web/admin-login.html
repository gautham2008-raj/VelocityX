<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Command — VELOCITY X</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

  <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.5rem 2rem; border-color: rgba(255, 0, 127, 0.35);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand" style="justify-content:center; margin-bottom: 0.5rem;">VELOCITY<span>X</span></a>
      <span class="badge" style="background: rgba(255, 0, 127, 0.2); color: var(--accent-magenta);">ROOT OPERATIONS COMMAND</span>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label>Operator Clearance ID (Email)</label>
        <input type="email" id="adminEmail" class="form-control" required value="admin@velocityx.io">
      </div>
      <div class="form-group">
        <label>Security Key</label>
        <input type="password" id="adminPassword" class="form-control" required placeholder="••••••••">
      </div>
      <div id="adminLoginError" style="color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, var(--accent-magenta), var(--accent-violet));">
        Verify Clearance
      </button>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('adminLoginError');
      err.style.display = 'none';
      try {
        await AuthEngine.login(
          document.getElementById('adminEmail').value,
          document.getElementById('adminPassword').value,
          true
        );
        window.location.href = 'admin-dashboard.html';
      } catch (ex) {
        err.innerText = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
