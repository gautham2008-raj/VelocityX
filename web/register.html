<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — VELOCITY X</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 2rem 0;">

  <div class="glass-panel" style="width: 100%; max-width: 480px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand" style="justify-content:center; margin-bottom: 0.5rem;">VELOCITY<span>X</span></a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Identity Registration & Clearance</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Account Clearance Tier</label>
        <select id="regRole" class="form-control" onchange="toggleAdminBlock(this.value)">
          <option value="CUSTOMER">Standard Customer Clearance</option>
          <option value="ADMIN">Root Operations Administrator</option>
        </select>
      </div>

      <!-- Admin Passcode Block (Hidden by default) -->
      <div id="adminSecretBlock" class="form-group" style="display: none; background: rgba(255, 0, 127, 0.1); border: 1px dashed var(--accent-magenta); padding: 1rem; border-radius: 8px;">
        <label style="color: var(--accent-magenta); font-weight: 700;">Admin Authorization Secret Key</label>
        <input type="password" id="adminSecret" class="form-control" placeholder="Enter Command Passcode (Default: VX-ROOT-2026)">
        <small style="color: var(--text-muted); display:block; margin-top: 4px;">Passcode required to assign Root Administrator clearance.</small>
      </div>

      <div class="form-group">
        <label>Full Legal Name</label>
        <input type="text" id="regName" class="form-control" required placeholder="Alex Mercer">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" class="form-control" required placeholder="alex@velocityx.io">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="regPhone" class="form-control" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label>Password (Min 6 Characters)</label>
        <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
      </div>
      <div id="regError" style="color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" style="color: var(--accent-cyan);">Sign In</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function toggleAdminBlock(role) {
      document.getElementById('adminSecretBlock').style.display = (role === 'ADMIN') ? 'block' : 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('regError');
      err.style.display = 'none';

      const role = document.getElementById('regRole').value;
      const secret = document.getElementById('adminSecret').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            phone: document.getElementById('regPhone').value,
            role: role,
            adminSecret: secret
          })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Registration failed');
        }

        if (role === 'ADMIN') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (ex) {
        err.innerText = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
